name: Sales sync (OTA)

# Triggers POST /api/sales/sync on the deployed app once an hour, on the
# hour. The route itself is self-governing (skips if a run is already in
# progress, skips if the source's row count hasn't moved, skips if it's
# still cooling down from a rate limit) — this workflow's only job is to
# knock on the door on a schedule and surface failures in the Actions tab.
#
# Required repo configuration (Settings -> Secrets and variables -> Actions):
#   Variables: SALES_SYNC_URL   -> e.g. https://your-app.vercel.app/api/sales/sync
#   Secrets:   SALES_SYNC_TOKEN -> must match SALES_SYNC_TOKEN in the app's env

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Trigger sales sync
        run: |
          if [ -z "${{ vars.SALES_SYNC_URL }}" ] || [ -z "${{ secrets.SALES_SYNC_TOKEN }}" ]; then
            echo "SALES_SYNC_URL (repo variable) and/or SALES_SYNC_TOKEN (repo secret) are not set." >&2
            exit 1
          fi

          # A full multi-pass sync has been observed taking up to ~14 minutes
          # server-side (confirmed from sales_sync_logs durations) — the
          # previous 480s (8min) max-time was shorter than that, so plenty of
          # genuinely-successful syncs were being reported as failed here
          # purely because curl gave up before the server finished responding.
          # No retry: retrying a call that can legitimately take this long
          # would just double the runtime for no benefit — the route already
          # guards against overlapping runs itself (skips if one from the
          # last 30 minutes is still in progress), and next hour's trigger is
          # the natural retry.
          http_status=$(curl -sS -o response.json -w "%{http_code}" \
            --max-time 900 \
            -X POST "${{ vars.SALES_SYNC_URL }}" \
            -H "x-sync-token: ${{ secrets.SALES_SYNC_TOKEN }}") || true

          echo "HTTP status: $http_status"
          cat response.json 2>/dev/null
          echo

          if [ -z "$http_status" ] || [ "$http_status" -ge 400 ]; then
            echo "Sync request failed." >&2
            exit 1
          fi
